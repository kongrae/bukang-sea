<title>길 잃은 상어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen harbour app that behaves like a native game. Board takes every spare pixel, compact HUD above,
   thumb-sized control bar below. Screens push/pop sideways, results arrive as a bottom sheet. Single committed "북항 수로" look. */
:root {
  --harbor: #0c3340;       /* page ground: deep harbour water */
  --harbor-2: #124452;     /* raised panels */
  --harbor-3: #1b5766;     /* hover / pressed */
  --water: #1e7482;        /* canal water */
  --water-hi: #6fd0cc;     /* ripples, jets */
  --sea: #0f4f6e;          /* open sea at the exit */
  --concrete: #d9d1c1;     /* promenade */
  --concrete-2: #c4b9a3;   /* paver seams */
  --rail: #eef0ea;
  --park: #6b9a5b;
  --ink: #0a232b;
  --text: #ecf5f2;
  --muted: #9dbfbe;
  --buoy: #ff6b3d;         /* accent: lifebuoy orange */
  --buoy-deep: #c8441b;
  --star: #ffc94a;
  --net: #ecd9a0;
  --shark: #c1baa6;        /* warm shark back, distinct from teal water */
  --shark-2: #938d79;
  /* "Bukang *" = bundled subset fonts (www/ build only, renamed per OFL); the Google Fonts names serve the other builds */
  --font-display: "Bukang Display", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Bukang Body", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(.2, .85, .25, 1);
  --ease-sheet: cubic-bezier(.16, 1, .3, 1);
  --ease-spring: cubic-bezier(.3, 1.5, .5, 1);
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--harbor);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  letter-spacing: -.01em;
  /* Korean typesetting: break between words (not inside them), never fake a bold on single-weight faces */
  word-break: keep-all; overflow-wrap: break-word;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
  /* app feel: no text selection, no long-press callouts, no tap flash, no double-tap zoom */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  /* safe-area insets matter when installed (PWA standalone, native app with notch / gesture bar).
     Capacitor 8 on Android reports them as --safe-area-inset-* variables (SystemBars insetsHandling "css"); browsers use env(). */
  padding-inline: max(12px, var(--safe-area-inset-left, env(safe-area-inset-left))) max(12px, var(--safe-area-inset-right, env(safe-area-inset-right)));
  padding-block: max(8px, var(--safe-area-inset-top, env(safe-area-inset-top))) max(10px, var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.screen.enter-fwd { animation: push-in .34s var(--ease-out) both; }
.screen.enter-back { animation: pop-in .34s var(--ease-out) both; }
@keyframes push-in { from { transform: translateX(30%); opacity: 0; } }
@keyframes pop-in { from { transform: translateX(-16%); opacity: 0; } }

/* ----- Title ----- */
.title-screen { overflow-y: auto; gap: 12px; scrollbar-width: none; margin-inline: -12px; padding-inline: 12px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
.title-screen::-webkit-scrollbar { display: none; }
.hero { position: relative; border-radius: 24px; overflow: hidden; background: var(--water); flex-shrink: 0; }
.hero canvas { display: block; width: 100%; height: 128px; }
.hero-text { position: absolute; left: 16px; bottom: 12px; right: 16px; pointer-events: none; }
.eyebrow { font-size: 13px; letter-spacing: .03em; color: var(--muted); font-weight: 500; }
.hero .eyebrow { font-size: 11.5px; color: var(--ink); opacity: .7; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(34px, 10vw, 42px);
  line-height: 1;
  margin: 2px 0 0;
  color: var(--ink);
  text-wrap: balance;
  letter-spacing: -.01em;
}
h1 .sea { color: var(--buoy-deep); }
.lede { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; text-wrap: pretty; }
.lede b { color: var(--star); font-weight: 700; }
/* daily canal card: the one bright block on the title, sea-to-canal gradient with a lifebuoy badge */
.daily {
  border: 0; border-radius: 18px; padding: 12px 14px; cursor: pointer; text-align: left; color: var(--text);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0; position: relative; overflow: hidden;
  background: linear-gradient(120deg, var(--sea), var(--water));
  transition: transform .2s var(--ease-spring), filter .15s;
}
.daily::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; border: 18px solid rgba(255,255,255,.06); pointer-events: none; }
.daily:active { transform: scale(.97); transition-duration: .08s; }
.daily-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.daily-k { font-size: 12.5px; letter-spacing: .04em; color: var(--water-hi); font-weight: 700; }
.daily-date { font-family: var(--font-display); font-size: 20px; line-height: 1.15; letter-spacing: 0; }
.daily-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.daily-state {
  flex-shrink: 0; width: 54px; height: 54px; border-radius: 50%; background: var(--buoy); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.35); z-index: 1;
}
.daily-state b { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: 0; }
.daily-state span { font-size: 12px; font-weight: 700; }
.daily-state b i { font-style: normal; opacity: .3; }
.daily.done .daily-state { background: var(--star); }
.daily.done .daily-state b { font-size: 13px; letter-spacing: 0; }
@media (hover: hover) { .daily:hover { filter: brightness(1.06); } }
/* my shark: preview of the skin in use */
.myshark {
  border: 0; border-radius: 18px; padding: 12px 14px; cursor: pointer; text-align: left; color: var(--text);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--harbor-2);
  transition: transform .2s var(--ease-spring), background .15s;
}
.myshark:active { transform: scale(.97); transition-duration: .08s; }
.myshark canvas { width: 68px; height: 44px; border-radius: 12px; flex-shrink: 0; }
.myshark-name { font-family: var(--font-display); font-size: 19px; line-height: 1.15; letter-spacing: 0; }
.myshark-go { flex-shrink: 0; font-size: 14px; font-weight: 700; color: var(--star); }
@media (hover: hover) { .myshark:hover { background: var(--harbor-3); } }
.section-label { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.section-label h2 { font-size: 13.5px; letter-spacing: .02em; color: var(--muted); margin: 0; font-weight: 500; }
.section-label span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapter-picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex-shrink: 0; }
.chapter-btn { border: 1px solid var(--harbor-3); border-radius: 12px; padding: 7px 4px; min-height: 52px; cursor: pointer; background: var(--harbor-2); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.chapter-btn b { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.2; }
.chapter-btn span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapter-btn[aria-pressed="true"] { border-color: var(--buoy); background: var(--harbor-3); }
.chapter-btn:active { transform: scale(.96); }
.chapters { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
.chapter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapter-head:first-child { margin-top: 0; }
.chapter-head h3 { font-family: var(--font-display); font-weight: 400; font-size: 23px; color: var(--text); margin: 0; line-height: 1.3; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lv {
  background: var(--harbor-2); border: 2px solid transparent; border-radius: 18px;
  min-height: 80px; padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 0; transition: background .15s, transform .18s var(--ease-spring);
  animation: tile-in .4s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 14ms);
}
@keyframes tile-in { from { transform: translateY(10px) scale(.96); opacity: 0; } }
.lv:active { transform: scale(.93); transition-duration: .08s; }
.lv:focus-visible, .chapter-btn:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .ctrl:focus-visible, .daily:focus-visible, .myshark:focus-visible, .skin:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.lv .n { font-family: var(--font-display); font-size: 32px; line-height: 1.05; letter-spacing: 0; }
.lv .nm { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lv .st { font-size: 13px; letter-spacing: 1px; color: var(--star); line-height: 1; }
.lv .st i { font-style: normal; color: var(--harbor-3); }
.lv.cur { border-color: var(--buoy); background: var(--harbor-3); }
.lv[disabled] { opacity: .38; cursor: default; }
.lv[disabled]:active { transform: none; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; font-size: 14px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.legend canvas { width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px; }
.note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--harbor-3); padding-top: 12px; margin: 0; }
.cta-bar { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; flex-shrink: 0; }
.journey-label { margin: 0; color: var(--muted); font-size: 13px; }
.journey-label b { color: var(--text); font-weight: 500; }
.extra-options { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; flex-shrink: 0; }

/* ----- Buttons ----- */
.btn {
  border: 0; border-radius: 16px; min-height: 52px; padding: 12px 18px; cursor: pointer; font-weight: 700; font-size: 16px;
  background: var(--harbor-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, transform .2s var(--ease-spring), filter .15s;
}
.btn:active { transform: scale(.95); transition-duration: .08s; }
.btn.primary { background: var(--buoy); color: var(--ink); box-shadow: 0 6px 0 var(--buoy-deep); }
.btn.primary:active { transform: translateY(4px) scale(.98); box-shadow: 0 2px 0 var(--buoy-deep); }
.btn.big { width: 100%; min-height: 58px; font-size: 17.5px; border-radius: 18px; }
.btn[disabled] { opacity: .4; cursor: default; }
.icon-btn {
  border: 0; background: var(--harbor-2); border-radius: 14px; width: 46px; height: 46px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; transition: background .15s, transform .2s var(--ease-spring);
}
.icon-btn:active { transform: scale(.9); transition-duration: .08s; }
.hero .icon-btn { position: absolute; top: 12px; right: 12px; background: rgba(10,35,43,.28); color: #fff; z-index: 1; }
@media (hover: hover) {
  .lv:not([disabled]):hover, .btn:not(.primary):hover, .icon-btn:hover, .ctrl:hover { background: var(--harbor-3); }
  .btn.primary:hover { filter: brightness(1.06); }
}

/* ----- Game ----- */
.game-screen { gap: 6px; touch-action: none; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.topbar .lvl-title { flex: 1; min-width: 0; text-align: center; }
.lvl-title .num { font-size: 12px; color: var(--muted); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.lvl-title .name { font-family: var(--font-display); font-size: 25px; line-height: 1.15; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.chip {
  background: var(--harbor-2); border-radius: 999px; padding: 4px 12px; font-size: 13.5px;
  display: inline-flex; gap: 6px; align-items: baseline; font-variant-numeric: tabular-nums;
}
.chip b { font-weight: 700; display: inline-block; }
.chip b.bump { animation: count-bump .35s var(--ease-spring); }
@keyframes count-bump { 40% { transform: scale(1.35); } }
.chip .k { color: var(--muted); }
.chip.over b { color: var(--buoy); }
.chip.done b { color: var(--star); }
.chip.net { background: var(--harbor-3); }
.tip { font-size: 13.5px; color: var(--muted); text-align: center; min-height: 2.6em; line-height: 1.3; margin: 0; text-wrap: balance; display: flex; align-items: center; justify-content: center; }
.tip.hint { color: var(--star); }
.tip.flash { animation: tip-in .3s var(--ease-out); }
@keyframes tip-in { from { transform: translateY(4px); opacity: 0; } }
/* the playfield runs edge to edge between HUD and controls; the canvas fills it (camera view, see resize()) */
.board { flex: 1; min-height: 0; position: relative; margin-inline: -12px; }
.board .frame { position: absolute; inset: 0; overflow: hidden; will-change: transform; }
.board .frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 12px 16px -12px rgba(0,0,0,.45), inset 0 -12px 16px -12px rgba(0,0,0,.45); }
.board canvas { display: block; }
.board .frame.enter { animation: board-in .42s var(--ease-out) both; }
@keyframes board-in { from { transform: scale(.94); opacity: 0; } }
.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ctrl {
  border: 0; border-radius: 16px; background: var(--harbor-2); cursor: pointer; min-height: 52px; padding: 8px 6px;
  display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14.5px; font-weight: 700;
  transition: background .15s, transform .2s var(--ease-spring), opacity .15s;
}
.ctrl svg.i { width: 24px; height: 24px; }
.ctrl:active { transform: scale(.92); transition-duration: .08s; }
.ctrl[disabled] { opacity: .35; cursor: default; }
.ctrl[disabled]:active { transform: none; }
.kbd { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
@media (hover: none), (pointer: coarse), (max-height: 760px) { .kbd { display: none; } }

/* ----- Clear sheet ----- */
.overlay {
  position: fixed; inset: 0; background: rgba(4, 18, 24, .62); display: flex; align-items: flex-end; justify-content: center;
  z-index: 10; animation: fade .3s ease-out;
}
.card {
  background: var(--concrete); color: var(--ink); width: 100%; max-width: 520px;
  border-radius: 28px 28px 0 0; padding: 10px 22px calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
  display: flex; flex-direction: column; gap: 14px; text-align: center; animation: sheet-up .5s var(--ease-sheet) both;
  box-shadow: 0 -10px 40px rgba(0,0,0,.3);
}
.card::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: #b9ad95; margin: 0 auto 4px; }
@keyframes sheet-up { from { transform: translateY(100%); } }
@media (min-width: 640px) and (min-height: 640px) {
  .overlay { align-items: center; }
  .card { border-radius: 28px; padding-bottom: 22px; animation-name: pop; }
  .card::before { display: none; }
}
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 38px; letter-spacing: 0; margin: 4px 0 0; line-height: 1.1; }
.card .sub { margin: 0; font-size: 14px; color: #3d4d4f; }
.stars { display: flex; justify-content: center; gap: 12px; }
.star { width: 62px; height: 62px; }
.star:nth-child(2) { transform: translateY(-8px); }
.star path { fill: #b9ad95; }
.star.on path { fill: var(--star); stroke: #c7881a; stroke-width: 1.5; }
.star.on { animation: star-pop .55s var(--ease-spring) both; }
.star.on:nth-child(2) { animation-name: star-pop-mid; }
@keyframes star-pop { from { transform: scale(0) rotate(-30deg); opacity: 0; } }
@keyframes star-pop-mid { from { transform: translateY(-8px) scale(0) rotate(-30deg); opacity: 0; } }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; text-align: left; }
.checks li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed #b9ad95; padding: 6px 2px; font-variant-numeric: tabular-nums; }
.checks li:last-child { border-bottom: 0; }
.checks .ok { color: #1f6e4a; font-weight: 700; }
.checks .no { color: #8a5a3a; }
.card .row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
.card .btn { background: #c8bea9; min-height: 56px; }
.card .btn.primary { background: var(--buoy); }
/* skins sheet */
.skins { max-height: 88vh; overflow-y: auto; }
.skin-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.skin {
  border: 2px solid transparent; border-radius: 16px; background: #c8bea9; padding: 8px 8px 10px; cursor: pointer; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; transition: transform .2s var(--ease-spring);
}
.skin canvas { width: 100%; aspect-ratio: 8 / 5; max-width: 100%; border-radius: 12px; }
.skin-name { font-family: var(--font-display); font-size: 17px; letter-spacing: 0; }
.skin-need { font-size: 12.5px; color: #5b6a6c; text-align: center; font-variant-numeric: tabular-nums; }
.skin.sel { border-color: var(--buoy-deep); background: #e6dcc8; }
.skin.sel .skin-need { color: var(--buoy-deep); font-weight: 700; }
.skin[disabled] { cursor: default; }
.skin[disabled] canvas { filter: grayscale(1) brightness(.55); }
.skin[disabled] .skin-name { opacity: .55; }
.skin:not([disabled]):active { transform: scale(.95); transition-duration: .08s; }
.checks .new { color: var(--buoy-deep); font-weight: 700; }
/* settings sheet: native-style switches */
.settings { gap: 6px; }
.settings h3 { margin-bottom: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 4px 4px; border-bottom: 1px solid #c8bea9; font-size: 16.5px; font-weight: 500; text-align: left; cursor: pointer; }
.switch small { display: block; font-size: 13px; font-weight: 400; color: #5b6a6c; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { flex-shrink: 0; width: 54px; height: 32px; border-radius: 16px; background: #b9ad95; position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .25s var(--ease-spring); }
.switch input:checked + .track { background: #1f8a6e; }
.switch input:checked + .track::after { transform: translateX(22px); }
.switch input:focus-visible + .track { outline: 2px solid var(--buoy-deep); outline-offset: 2px; }
.settings .btn { margin-top: 10px; }
.guide { max-height: 88vh; overflow: hidden; }
.guide h3, .guide .btn { flex-shrink: 0; }
.guide-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; text-align: left; min-height: 0; overflow-y: auto; }
.guide-items li { display: flex; align-items: flex-start; gap: 12px; }
.guide-items canvas { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; }
.guide-items b { font-size: 18px; }
.guide-items p { margin: 4px 0 0; font-size: 15px; line-height: 1.6; }

@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { transform: scale(.6); opacity: 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
@media (max-height: 640px) {
  .tip { min-height: 0; }
  .ctrl { min-height: 48px; }
}
@media (max-height: 700px) {
  .title-screen { gap: 10px; }
  .hero canvas { height: 110px; }
  .game-screen { gap: 3px; }
  .game-screen .topbar { min-height: 44px; }
  .game-screen .icon-btn { width: 44px; height: 44px; }
  .lvl-title .num { line-height: 1.3; }
  .lvl-title .name { font-size: 23px; }
  .chip { padding: 3px 10px; }
  .ctrl { min-height: 48px; }
}
</style>

<div class="app" id="app">
  <section class="screen title-screen" id="titleScreen">

const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const JET = { '^': 'U', 'v': 'D', '<': 'L', '>': 'R' };
const OPP = { U: 'D', D: 'U', L: 'R', R: 'L' };

function parseLevel(level) {

// Slide until blocked. path excludes the start tile; each step is [x, y, dir] (a 4th element `true` marks

// After every shark move each boat, in order, steps one tile along its heading. A boat turns around when the
// tile ahead is a wall, buoy, the sea exit, a net, the shark or another boat, and stays put if both ways are blocked.
function stepBoats(g, boats, sharkIdx, nets) {

    return !next.some((b, k) => k !== self && b[0] === i);

const boatsKey = boats => boats.map(b => b[0] + b[1]).join(',');
// BFS over (position, fish mask, boats). Returns {moves, seq} or null. boats defaults to the level's start.
function bfsFrom(g, pos, mask, nets, needAll, cap, boats) {

// Minimum SWIPES under the live rules. Nets can be removed/replaced for free BETWEEN moves.
// Thus a search node needs only (position, fish mask, boats): every legal net configuration is

// `netsLeft` retains its old meaning (unused inventory); placed nets are also reusable.
// Returns {moves, seq, add, remove, steps:[{dir, nets:[idx]}]} or null. add/remove concern step 1 only.

  parts.push(`<span class="chip${st.moves > L.par ? ' over' : ''}"><span class="k">이동</span><b>${st.moves}</b><span class="k">/ 기준 ${L.par}</span></span>`);
  if (g.fish.length) parts.push(`<span class="chip${st.fish.length === g.fish.length ? ' done' : ''}"><span class="k">숭어</span><b>${st.fish.length} / ${g.fish.length}</b></span>`);
  if (g.nets) parts.push(`<span class="chip net"><span class="k">남은 그물</span><b>${g.nets - st.nets.length}</b></span>`);
  $('stats').innerHTML = parts.join('');
  const bs = $('stats').querySelectorAll('.chip b');
  if (hudLast.moves >= 0 && st.moves !== hudLast.moves && bs[0]) bs[0].classList.add('bump');
  if (g.fish.length && hudLast.fish >= 0 && st.fish.length !== hudLast.fish && bs[1]) bs[1].classList.add('bump');
  hudLast = { moves: st.moves, fish: st.fish.length };

}
function pushHistory() {
  st.history.push({ pos: st.pos.slice(), dir: st.dir, fish: st.fish.slice(), nets: st.nets.slice(), boats: st.boats.map(b => b.slice()), moves: st.moves });
  if (st.history.length > 200) st.history.shift();
}

// The result is committed at once; the screen follows through `anim`. A swipe during the glide is queued (one deep).

    sfx.bump();

    return;

    if (fi != null && !st.fish.includes(fi) && !eats.some(e => e.fi === fi)) eats.push({ fi, k: k + 1 });

}
function eatFish(fi) {

  const [fx, fy] = g.fish[fi];
  particles.push({ kind: 'fish', x: fx, y: fy, fi, life: 1 });
  particles.push({ kind: 'text', x: fx, y: fy, vx: 0, vy: -1.3, life: 1 });
  ring(fx, fy, 0.9, 0.5);
  if (!reduceMotion) for (let s = 0; s < 7; s++) { const a = s / 7 * Math.PI * 2 + Math.random() * 0.4; particles.push({ kind: 'spark', x: fx, y: fy, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4, life: 1, rot: Math.random() * 6 }); }
  updateHud();
}
function finishAnim() {
  const a = anim; anim = null;
  const last = a.pts[a.win ? a.n : a.steps]; view.x = last[0]; view.y = last[1];
  a.eats.forEach(e => { if (!st.fish.includes(e.fi)) st.fish.push(e.fi); });
  updateHud();
  if (a.win) { onClear(); return; }
  if (g.nets && !save.coachNet && !queued) setupCoach();

    settle = { t: 0, d: a.dirs[a.steps], amp: 0.35 }; ring(view.x, view.y, 0.8, 0.45); sfx.sand(); haptic('light');

  splashAt(view.x + dx * 0.45, view.y + dy * 0.45, 4 + Math.round(6 * amp), d, 0.5 + amp * 0.7);

function undo() {

  view.x = st.pos[0]; view.y = st.pos[1]; view.target = ANG[st.dir];

function restart() { if (anim) return; replay(); haptic('light'); }

function tapTile(gx, gy) {

  if (!g.nets) { setTip('화면을 밀어서 상어를 움직여요. 방향키도 돼요.'); return; }
  const idx = gy * g.w + gx, c = cellAt(g, gx, gy);
  const hasFish = g.fish.some((f, i) => f[0] === gx && f[1] === gy && !st.fish.includes(i)) || st.boats.some(b => b[0] === idx);
  const at = st.nets.indexOf(idx);

    hintRequest++; pushHistory(); st.nets.splice(at, 1); netPop.delete(idx);
    sfx.net(); haptic('tick'); ring(gx, gy, 0.6, 0.35); updateHud(); checkpoint();
    if (hint) refreshHint(); else setTip(curLevel().tip);
    return;
  }
  if (c !== '.' || hasFish || (gx === st.pos[0] && gy === st.pos[1])) { setTip('그물은 비어 있는 물 위에만 칠 수 있어요.'); haptic('light'); return; }
  if (st.nets.length >= g.nets) { setTip('그물을 다 썼어요. 쳐 둔 그물을 누르면 다시 걷을 수 있어요.'); haptic('light'); return; }

// Keep the same next-move recipe while the player performs its free net edits. Replanning after

  hint.nets = hint.target.filter(i => !st.nets.includes(i));
  const action = hint.remove.length ? '반짝이는 그물을 눌러 걷어요.'
    : hint.nets.length ? '반짝이는 칸에 그물을 쳐요.' : `${DIR_KO[hint.dir]} 밀어 보세요.`;
  const more = hint.partial ? ' 숭어를 모두 먹으려면 되돌리기가 필요해요.' : ` 앞으로 ${hint.moves}번이면 나가요.`;
  setTip(`힌트: ${action}${more}`, true);

    && !$('gameScreen').hidden && !settingsOpen();

    while (current()) {
      const step = search.next();
      if (step.done) return step.value;
      await new Promise(resolve => setTimeout(resolve, 0));

  hint = { dir: p.seq[0], target: p.steps[0].nets, moves: p.moves, partial };
  refreshHint();
}

function onClear() {
  cleared = true;
  delete save.sessions[DAILY ? 'daily' : 'story'];
  const L = curLevel();
  const allFish = st.fish.length === g.fish.length, inPar = st.moves <= L.par;
  const stars = starsForClear(allFish, inPar);
  const earned = [true, stars >= 2, stars === 3];
  if (DAILY) recordDaily(DAILY.date, stars);
  else { save.best[LVL] = Math.max(save.best[LVL] || 0, stars); persist(); }
  const freshSkins = refreshSkins();
  sfx.win();
  const starSvg = on => `<svg class="star${on ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>`;
  $('clearStars').innerHTML = earned.map(starSvg).join('');
  $('clearStars').setAttribute('aria-label', `별 ${stars}개`);
  const titles = ['바다로 나갔어요!', '시원하게 탈출!', '상어야, 잘 가!'];
  const chap = chapterOf(LVL), chapterEnd = !DAILY && LVL === chap.end, last = !DAILY && LVL === LEVELS.length - 1;
  $('clearTitle').textContent = DAILY ? (stars === 3 ? '오늘의 수로 완벽!' : '오늘의 수로 완료!')
    : last ? '드디어 넓은 바다로!' : chapterEnd ? `${chap.name} 통과!` : titles[stars - 1];
  const row = (label, val, ok) => `<li><span>${label}</span><span class="${ok ? 'ok' : 'no'}">${val}</span></li>`;
  $('clearChecks').innerHTML =
    row('바다로 탈출', '성공', true) +
    row('숭어 모두 먹기', g.fish.length ? `${st.fish.length} / ${g.fish.length}` : '숭어 없음', allFish) +
    row('숭어 + 이동 기준', `${st.moves}번 / ${L.par}번${allFish ? '' : ' · 숭어 필요'}`, stars === 3) +
    (DAILY ? row('연속 도전', `${dailyStreak()}일째`, true) : '') +
    (freshSkins.length ? `<li><span>새 상어가 열렸어요</span><span class="new">${freshSkins.map(k => k.name).join(', ')}</span></li>` : '');
  $('nextBtn').textContent = DAILY || last ? '수로 목록' : chapterEnd ? '다음 장으로' : '다음 수로';
  setTimeout(() => {
    if (!cleared) return;
    $('clearOverlay').hidden = false; $('nextBtn').focus({ preventScroll: true });
    earned.forEach((on, k) => { if (on) setTimeout(() => haptic('light'), 180 + k * 120); });
    if (freshSkins.length) setTimeout(() => haptic('success'), 600);

}

/* ---------- daily canal: record, streak, title card ---------- */
const WEEKDAY_KO = '일월화수목금토';
function dateLabel(date) {
  const [y, m, d] = date.split('-').map(Number);
  return `${m}월 ${d}일 ${WEEKDAY_KO[new Date(y, m - 1, d).getDay()]}요일`;
}
function recordDaily(date, stars) {
  const done = Object.assign({}, save.daily);
  done[date] = Math.max(done[date] || 0, stars);
  const keys = Object.keys(done).sort();
  keys.slice(0, Math.max(0, keys.length - 120)).forEach(k => delete done[k]);   // keep ~4 months
  save.daily = done; persist();
}
// consecutive days cleared, counting back from today (or from yesterday if today is not done yet)
function dailyStreak() {
  const done = save.daily || {}, d = new Date();
  if (!done[dailyDate(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (done[dailyDate(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
let todayDaily = null;   // generated once per date
function getTodayDaily() {
  const date = dailyDate();
  if (!todayDaily || todayDaily.date !== date) todayDaily = makeDaily(date);
  return todayDaily;
}
function renderDaily() {
  const date = dailyDate(), stars = (save.daily || {})[date] || 0, streak = dailyStreak();
  if (save.sessions.daily && save.sessions.daily.id !== date) { delete save.sessions.daily; persist(); }
  const [y, m, d] = date.split('-').map(Number), tier = DAILY_TIERS[new Date(y, m - 1, d).getDay()];
  $('dailyDate').textContent = dateLabel(date);
  $('dailyMeta').textContent = `난이도 ${'●'.repeat(tier.stars)}${'○'.repeat(5 - tier.stars)} ${tier.label}` + (streak ? ` · 연속 ${streak}일` : '');
  const resume = save.sessions.daily && dailySession(getTodayDaily());
  $('dailyState').innerHTML = resume ? `<b>이어서</b><span>${resume.moves}회 진행</span>` : stars ? `<b>${'★'.repeat(stars)}<i>${'★'.repeat(3 - stars)}</i></b><span>완료</span>` : `<b>도전</b><span>하기</span>`;
  $('dailyBtn').classList.toggle('done', !!stars);
  $('dailyBtn').setAttribute('aria-label', `오늘의 수로, ${dateLabel(date)}, ${tier.label}${resume ? `, ${resume.moves}회 진행 이어서 하기` : stars ? `, 별 ${stars}개 완료` : ''}`);
}
/* ---------- my shark: title card and skin picker ---------- */

}

/* ---------- rendering ---------- */
const board = $('board'), frameEl = $('boardFrame'), cvs = $('boardCanvas'), ctx = cvs.getContext('2d');
// Camera view: the canvas fills the whole board area. The canal is drawn as large as fits (outer promenade columns may be
// cut by CROP when width is the limit) and the rest of the screen continues the world: promenade all around (the engine
// already treats everything outside the grid as '#'), and open sea running out from each exit to the screen edge.
const CROP = 0.3;   // share of each outer promenade column that may fall outside the view to make the tiles bigger
let OX = 0, OY = 0, CW = 0, CH = 0, seaCells = new Set();
function resize() {
  if (!g || $('gameScreen').hidden) return;
  const r = board.getBoundingClientRect();
  CW = Math.floor(r.width); CH = Math.floor(r.height);
  T = Math.max(18, Math.floor(Math.min(CW / (g.w - 2 * CROP), CH / g.h, 132)));
  OX = Math.round((CW - g.w * T) / 2); OY = Math.round((CH - g.h * T) / 2);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.style.width = CW + 'px'; cvs.style.height = CH + 'px';
  cvs.width = Math.round(CW * dpr); cvs.height = Math.round(CH * dpr);
  cvs.dataset.tile = T; cvs.dataset.ox = OX; cvs.dataset.oy = OY;   // grid placement, read by tools/shots.js
  causticPat = null;
  buildStatic();
}
// Hints, wrapped counters and font loading can change board space without a window resize.
// Keep the canvas and tap coordinates fitted to the actual board after those layout changes.
if (typeof ResizeObserver !== 'undefined') {
  const boardResize = new ResizeObserver(() => {
    if (!g || $('gameScreen').hidden) return;
    const r = board.getBoundingClientRect();
    if (Math.floor(r.width) !== CW || Math.floor(r.height) !== CH) resize();
  });
  boardResize.observe(board);
}
// '~' = open sea beyond an exit, '#' = promenade everywhere else outside the grid
function exitDir(x, y) { return y === 0 ? 'U' : y === g.h - 1 ? 'D' : x === 0 ? 'L' : 'R'; }
function buildSea() {
  seaCells = new Set();
  for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) if (cellAt(g, x, y) === 'E') {
    const [dx, dy] = DIRS[exitDir(x, y)];
    for (let k = 1; k <= 40; k++) seaCells.add((x + dx * k) + ',' + (y + dy * k));
  }
}
const cellType = (x, y) => (x < 0 || y < 0 || x >= g.w || y >= g.h) ? (seaCells.has(x + ',' + y) ? '~' : '#') : cellAt(g, x, y);

function buildStatic() {

  const x0 = Math.floor(-OX / T) - 1, x1 = Math.ceil((CW - OX) / T), y0 = Math.floor(-OY / T) - 1, y1 = Math.ceil((CH - OY) / T);

      // open sea: deepens with distance from the canal
      const d = Math.max(Math.abs(Math.min(x, g.w - 1 - x, 0)), Math.abs(Math.min(y, g.h - 1 - y, 0)));
      s.fillStyle = C.sea; s.fillRect(px, py, T, T);
      s.fillStyle = `rgba(3,20,30,${Math.min(0.45, d * 0.07).toFixed(3)})`; s.fillRect(px, py, T, T);
      waterPath.rect(px, py, T, T); continue;
    }
    if (c !== '#') { s.fillStyle = C.water; s.fillRect(px, py, T, T); waterPath.rect(px, py, T, T); if (c === 's') drawSand(s, px, py, T, x * 31 + y * 17 + deco); continue; }

      <span class="n">${i + 1}</span><span class="nm">${ok ? L.name : '잠김'}</span><span class="st">${stars}</span></button>`;
  };
  let start = 0;
  $('chapterPicker').innerHTML = CHAPTERS.map((ch, ci) => {
    const idx = Array.from({ length: ch.count }, (_, k) => start + k); start += ch.count;
    const stars = idx.reduce((n, i) => n + (save.best[i] || 0), 0), ok = unlocked(idx[0]);
    if (ci === selectedChapter) {
      grid.innerHTML = `<div class="chapter-head"><h3>${ch.name}</h3><span>★ ${stars} / ${ch.count * 3}</span></div>
        <div class="levels">${idx.map((i, k) => button(LEVELS[i], i, k)).join('')}</div>`;
    }
    return `<button class="chapter-btn" type="button" data-chapter="${ci}" aria-pressed="${ci === selectedChapter}" aria-label="${ci + 1}장 ${ch.name}${ok ? `, 별 ${stars}개` : ', 잠김'}"><b>${ci + 1}장</b><span>${ok ? `★ ${stars} / ${ch.count * 3}` : '잠김'}</span></button>`;
  }).join('');
  $('levelCount').textContent = `수로 ${LEVELS.length}곳`;
  $('starTotal').textContent = `★ ${total} / ${LEVELS.length * 3}`;
  const chap = chapterOf(target);
  $('journeyLabel').innerHTML = `${chap.ci + 1}장 ${chap.name} · <b>${LEVELS[target].name}</b>`;
  $('playBtn').textContent = resume ? `이어서 하기 · 수로 ${save.sessions.story.id + 1} · ${resume.moves}회 진행`
    : Object.keys(save.best).length ? `이어서 하기 · 수로 ${nextLevel() + 1}` : '시작하기';
}
function nextLevel() {
  for (let i = 0; i < LEVELS.length; i++) if (save.best[i] == null) return i;
  return Math.min(save.last, LEVELS.length - 1);
}
function renderLegend() {
  const items = [
    ['fish', '숭어 · 모두 먹으면 별 +1'], ['buoy', '부표 · 앞에서 멈춰요'],
    ['boat', '구조정 · 한 칸씩 오가요'], ['jet', '물줄기 · 방향이 꺾여요'],
    ['net', '그물 · 톡 눌러 치기'], ['exit', '바다 · 여기로 나가요'],
    ['sand', '모래톱 · 올라서면 멈춰요'], ['whirl', '소용돌이 · 짝으로 빨려 나가요'],
  ];
  $('legend').innerHTML = items.map(([k, l]) => `<div><canvas data-k="${k}" width="72" height="72"></canvas><span>${l}</span></div>`).join('');
  $('legend').querySelectorAll('canvas').forEach(drawLegendIcon);
}
function drawLegendIcon(c) {
  const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); const S = 36, k = c.dataset.k;
  x.fillStyle = C.water; x.fillRect(0, 0, S, S);
  if (k === 'fish') drawFish(x, 18, 18, S * 1.4, 0.4, 0.1);
  if (k === 'buoy') drawBuoy(x, 18, 18, S * 1.3, 0);
  if (k === 'boat') drawBoat(x, 18, 18, S * 1.2, 0, Math.PI / 2, true);
  if (k === 'jet') drawJet(x, 0, 0, S, 'R', 0.2);
  if (k === 'net') drawNet(x, 0, 0, S, false, 0);
  if (k === 'exit') drawExit(x, 0, 0, S, { w: 3, h: 3 }, 1, 0, 0);
  if (k === 'sand') drawSand(x, 0, 0, S, 5);
  if (k === 'whirl') drawWhirl(x, 18, 18, S, 0.4);
}
/* ---------- device rules: once on first encounter, always available from settings ---------- */
const DEVICE_GUIDES = [
  { key: 'boat', name: '구조정', text: '상어가 멈춘 뒤 한 칸 움직여요. 막히면 방향을 바꾸며, 그물을 치거나 회수할 때는 움직이지 않아요.', has: g => g.boats.length > 0 },
  { key: 'jet', name: '물줄기', text: '들어가면 화살표 방향으로 꺾여 계속 헤엄쳐요. 출발한 칸의 물줄기는 작동하지 않아요.', has: g => g.cells.some(c => JET[c]) },
  { key: 'net', name: '그물', text: '빈 물 칸을 톡 누르면 설치해요. 다시 누르면 회수해 다른 칸에 쓸 수 있어요. 설치와 회수는 이동 횟수에 포함되지 않아요.', has: g => g.nets > 0 },
  { key: 'sand', name: '모래톱', text: '올라서면 그 칸에서 멈춰요. 다음 이동에서는 다시 헤엄칠 수 있어요.', has: g => g.cells.includes('s') },
  { key: 'whirl', name: '소용돌이', text: '들어가면 짝 소용돌이로 옮겨져 같은 방향으로 계속 헤엄쳐요.', has: g => g.cells.includes('w') },
];
let guideKeys = [];
const guideOpen = () => !$('guideOverlay').hidden;
function showDeviceGuide(firstOnly = false) {
  const devices = DEVICE_GUIDES.filter(d => (g && !$('gameScreen').hidden ? d.has(g) : !firstOnly) && (!firstOnly || !save.seenDevices.includes(d.key)));
  if (firstOnly && !devices.length) return;
  guideKeys = devices.map(d => d.key);
  $('guideTitle').textContent = firstOnly ? '새 장치를 만났어요' : '장치 안내';
  $('guideItems').innerHTML = devices.length ? devices.map(d => `<li><canvas data-k="${d.key}" width="72" height="72" aria-hidden="true"></canvas><div><b>${d.name}</b><p>${d.text}</p></div></li>`).join('')
    : '<li><div><b>상어를 바다로 보내요</b><p>화면을 밀면 막힐 때까지 헤엄쳐요. 방향키로도 움직일 수 있어요. 숭어를 모두 먹고 이동 기준 안에 탈출하면 별 3개를 받아요.</p></div></li>';
  $('guideItems').querySelectorAll('canvas').forEach(drawLegendIcon);
  $('app').inert = true;
  $('guideOverlay').hidden = false; $('guideDone').focus({ preventScroll: true });
}
function closeGuide() {
  save.seenDevices = [...new Set([...save.seenDevices, ...guideKeys])]; persist();
  guideKeys = []; $('guideOverlay').hidden = true; $('app').inert = false;
  $($('gameScreen').hidden ? 'titleSettingsBtn' : 'settingsBtn').focus({ preventScroll: true });
}
// screen change with a native-style push (into a level) or pop (back to the list)
function show(which, animate = true) {
  if (which === 'title') { pauseGame(); $('guideOverlay').hidden = true; $('app').inert = false; guideKeys = []; cleared = false; }
  const el = which === 'title' ? $('titleScreen') : $('gameScreen');
  $('titleScreen').hidden = which !== 'title';
  $('gameScreen').hidden = which !== 'game';
  el.classList.remove('enter-fwd', 'enter-back');
  if (animate && !reduceMotion) { void el.offsetWidth; el.classList.add(which === 'game' ? 'enter-fwd' : 'enter-back'); }
  if (which === 'title') { $('clearOverlay').hidden = true; renderLevelGrid(true); renderDaily(); renderSkinCard(); $('titleScreen').scrollTop = 0; heroW = 0; }
  else requestAnimationFrame(resize);
}
function startLevel(i) { if (!unlocked(i)) return; const keep = storySession(i); show('game'); loadLevel(i, keep); }

$('levelGrid').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) { ac(); startLevel(+b.dataset.i); } });
$('chapterPicker').addEventListener('click', e => {
  const b = e.target.closest('.chapter-btn'); if (!b) return;
  selectedChapter = +b.dataset.chapter; renderLevelGrid();
  $('chapterPicker').querySelector(`[data-chapter="${selectedChapter}"]`).focus({ preventScroll: true });

$('playBtn').addEventListener('click', () => { ac(); startLevel(storySession() ? save.sessions.story.id : nextLevel()); });
$('dailyBtn').addEventListener('click', () => { ac(); startDaily(); });
$('skinBtn').addEventListener('click', openSkins);
$('skinsDone').addEventListener('click', closeSkins);
$('skinsOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSkins(); });
$('skinGrid').addEventListener('click', e => {
  const b = e.target.closest('.skin'); if (!b || b.disabled) return;
  save.skin = b.dataset.id; persist(); haptic('medium'); renderSkinGrid(); heroW = 0;
});
$('backBtn').addEventListener('click', () => show('title'));
$('undoBtn').addEventListener('click', undo);
$('restartBtn').addEventListener('click', restart);
$('hintBtn').addEventListener('click', showHint);
$('againBtn').addEventListener('click', replay);
$('nextBtn').addEventListener('click', () => { if (!DAILY && LVL < LEVELS.length - 1) loadLevel(LVL + 1); else show('title'); });
// settings sheet (sound, vibration) — opened from the gear on the title and in a level
const settingsOpen = () => !$('settingsOverlay').hidden;
function openSettings() { $('optSound').checked = save.sound; $('optVibe').checked = save.vibe; $('settingsOverlay').hidden = false; $('settingsDone').focus({ preventScroll: true }); }
function closeSettings() { $('settingsOverlay').hidden = true; }
$('settingsBtn').addEventListener('click', openSettings);
$('titleSettingsBtn').addEventListener('click', openSettings);
$('settingsDone').addEventListener('click', closeSettings);
$('deviceGuideBtn').addEventListener('click', () => { closeSettings(); showDeviceGuide(); });
$('guideDone').addEventListener('click', closeGuide);
$('settingsOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSettings(); });
$('optSound').addEventListener('change', e => { save.sound = e.target.checked; persist(); if (save.sound) sfx.eat(); });
$('optVibe').addEventListener('change', e => { save.vibe = e.target.checked; persist(); haptic('medium'); });
// light tick on every enabled button press, like native controls
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button:not([disabled])')) haptic('tick'); });
document.addEventListener('contextmenu', e => e.preventDefault());

// swipe anywhere on the game screen (fires as soon as the finger has travelled SWIPE px), tap on the board for nets
const gameScreen = $('gameScreen');
let gest = null;
const swipeDir = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
gameScreen.addEventListener('pointerdown', e => {
  if ((e.target.closest && e.target.closest('button')) || !$('clearOverlay').hidden || settingsOpen() || guideOpen()) return;
  gest = { x: e.clientX, y: e.clientY, id: e.pointerId, fired: false, onBoard: board.contains(e.target) };
  ac(); try { gameScreen.setPointerCapture(e.pointerId); } catch (_) {}
});
gameScreen.addEventListener('pointermove', e => {
  if (!gest || gest.fired || e.pointerId !== gest.id) return;
  const dx = e.clientX - gest.x, dy = e.clientY - gest.y;
  if (Math.hypot(dx, dy) >= SWIPE) { gest.fired = true; tryMove(swipeDir(dx, dy)); }
});
gameScreen.addEventListener('pointerup', e => {
  if (!gest || e.pointerId !== gest.id) return;
  const g0 = gest; gest = null;
  if (g0.fired) return;
  const dx = e.clientX - g0.x, dy = e.clientY - g0.y;
  if (Math.hypot(dx, dy) >= SWIPE) { tryMove(swipeDir(dx, dy)); return; }
  if (!g0.onBoard) return;
  const r = cvs.getBoundingClientRect();
  const gx = Math.floor((e.clientX - r.left - OX) / T), gy = Math.floor((e.clientY - r.top - OY) / T);
  if (gx >= 0 && gy >= 0 && gx < g.w && gy < g.h) tapTile(gx, gy);
});
gameScreen.addEventListener('pointercancel', () => { gest = null; });
window.addEventListener('keydown', e => {
  if (guideOpen()) { if (e.key === 'Escape') closeGuide(); return; }
  if (settingsOpen()) { if (e.key === 'Escape') closeSettings(); return; }
  if (skinsOpen()) { if (e.key === 'Escape') closeSkins(); return; }
  if (!$('clearOverlay').hidden) { if (e.key === 'Escape') replay(); return; }
  if ($('gameScreen').hidden) return;
  const map = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R' };
  if (map[e.key]) { e.preventDefault(); if (e.repeat) return; ac(); tryMove(map[e.key]); }
  else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { e.preventDefault(); undo(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'h' || e.key === 'H') showHint();
  else if (e.key === 'Escape') show('title');
});
window.addEventListener('resize', () => { resize(); heroW = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('pagehide', pauseGame);
// native app (Capacitor + @capacitor/app): hardware back returns to the level list, exits from the list
const capApp = window.Capacitor?.Plugins?.App;
if (capApp) capApp.addListener('backButton', () => {
  if (guideOpen()) closeGuide();
  else if (settingsOpen()) closeSettings();
  else if (skinsOpen()) closeSkins();
  else if ($('gameScreen').hidden) capApp.exitApp(); else show('title');
});
if (capApp) capApp.addListener('appStateChange', ({ isActive }) => { if (!isActive) pauseGame(); });

/* ---------- boot (keeps a game in progress across live page updates) ---------- */
function start(data) {
  refreshSkins();   // grant skins already earned by existing progress
  renderLegend(); renderLevelGrid();
  const resumeDaily = data && data.daily === dailyDate() && makeDaily(data.daily);
  const level = resumeDaily ? resumeDaily.level : data && LEVELS[data.lvl];
  const keep = level && data.st && restoreSession({ version: 1, id: 0, layout: levelSignature(level), state: data.st }, level, 0);
  if (data && data.screen === 'game' && keep && resumeDaily) { show('game', false); requestAnimationFrame(() => loadDaily(resumeDaily, keep)); }
  else if (data && !data.daily && data.screen === 'game' && keep && unlocked(data.lvl)) { show('game', false); requestAnimationFrame(() => loadLevel(data.lvl, keep)); }
  else show('title', false);
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ screen: $('gameScreen').hidden ? 'title' : 'game', lvl: LVL, daily: DAILY ? DAILY.date : null, st: st && !anim ? st : null }));
const boot = () => window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot, boot); else boot();
})();
