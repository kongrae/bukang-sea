<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>store caption</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700&display=block">
<style>
/* One captioned store screenshot, 360x640 css at 3x = 1080x1920, rendered by tools/shots.js over a raw scene from
   docs/store/. The band follows the promo shorts (ivory card, Jua, orange key word). Google Play preview assets: the
   tagline stays within 20% of the image (126 / 640), no device frame, no price, rank or call-to-action words.
   Caption glyphs are not in the app's subset fonts, so Jua and Noto Sans KR come from Google Fonts like the promo tool. */
:root { --card: #fffdf5; --ink: #153f53; --muted: #3f6474; --accent: #f26a1b; --frame: #9fdfe6; }
html, body { margin: 0; width: 360px; height: 640px; overflow: hidden; background: #e8f8f5; }
#shot { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
.band { position: absolute; left: 0; right: 0; top: 0; height: 126px; box-sizing: border-box; padding: 20px 14px 0; text-align: center;
  background: var(--card); border-radius: 0 0 26px 26px; box-shadow: 0 2px 0 var(--frame), 0 6px 0 #c3ebef, 0 10px 18px rgba(21, 63, 83, .16); }
h1 { margin: 0; font: 400 37px/1.12 Jua, sans-serif; color: var(--ink); letter-spacing: -.01em; white-space: nowrap; }
p { margin: 9px 0 0; font: 700 17.5px/1.3 "Noto Sans KR", sans-serif; color: var(--muted); letter-spacing: -.02em; white-space: nowrap; }
em { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
<img id="shot" alt="">
<div class="band"><h1 id="title"></h1><p id="sub"></p></div>
<script>
// tools/shots.js passes { src, title, sub, top } in the hash. {word} is drawn in the accent colour, top moves the scene down.
const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const rich = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]).replace(/\{([^}]+)\}/g, '<em>$1</em>');
document.getElementById('title').innerHTML = rich(spec.title);
document.getElementById('sub').innerHTML = rich(spec.sub);
const shot = document.getElementById('shot');
shot.style.top = (spec.top || 0) + 'px';
shot.src = spec.src;
const loaded = family => [...document.fonts].some(f => f.family.replace(/"/g, '') === family && f.status === 'loaded');
window.ready = Promise.all([shot.decode(), document.fonts.ready]).then(() => ({
  fonts: loaded('Jua') && loaded('Noto Sans KR'),
  fits: [...document.querySelectorAll('h1, p')].every(e => e.scrollWidth <= e.clientWidth),
}));
</script>
</body>
</html>
