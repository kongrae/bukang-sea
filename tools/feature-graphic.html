<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>feature graphic</title>
<style>
/* Google Play feature graphic, 1024x500. Rendered by tools/shots.js. Same look as the redesigned title card
   (docs/VISUAL-REDESIGN.md): aqua page, ivory card with a bevel, canal panel with the hero shark, orange accent. */
@font-face { font-family: "Bukang Display"; src: url("../assets/fonts/jua-400.woff2") format("woff2"); }
@font-face { font-family: "Bukang Body"; font-weight: 700; src: url("../assets/fonts/noto-sans-kr-700.woff2") format("woff2"); }
:root { --page: #dcf5f4; --page-2: #b5ecf0; --card: #fffdf5; --water: #218eac; --water-2: #126d9e; --ink: #153f53; --muted: #426574; --accent: #ff873f; --frame: #9fdfe6; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: linear-gradient(160deg, var(--page) 0%, var(--page-2) 100%); }
.card { position: absolute; left: 36px; top: 34px; width: 952px; height: 432px; border-radius: 40px; background: var(--card);
  box-shadow: 0 0 0 3px var(--frame), 0 14px 0 #8fd2db, 0 22px 30px rgba(21, 63, 83, .18); }
.water { position: absolute; right: 30px; top: 30px; width: 420px; height: 372px; border-radius: 30px; overflow: hidden;
  background: linear-gradient(180deg, #2a9bb9 0%, var(--water) 45%, var(--water-2) 100%); box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); }
.water svg { position: absolute; inset: 0; }
.shark { position: absolute; left: 50%; top: 50%; width: 370px; height: 370px; transform: translate(-50%, -46%); filter: drop-shadow(0 16px 18px rgba(8, 40, 60, .35)); }
.text { position: absolute; left: 52px; top: 56px; font-family: "Bukang Display", sans-serif; color: var(--ink); }
h1 { margin: 0; font-weight: 400; font-size: 118px; line-height: 1; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.subtitle { margin: 10px 0 0; font-family: "Bukang Body", sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1; color: var(--ink); }
.eyebrow { margin-top: 34px; font-family: "Bukang Body", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em; color: var(--muted); }
.pill { display: inline-block; margin-top: 26px; padding: 14px 30px; border-radius: 999px; background: var(--accent); color: #fff;
  font-family: "Bukang Display", sans-serif; font-size: 34px; line-height: 1; box-shadow: 0 6px 0 #c65121; }
</style>
</head>
<body>
  <div class="card">
    <div class="water">
      <svg viewBox="0 0 420 372" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="4" stroke-linecap="round">
          <path d="M34 60 q26 -10 52 0 t52 0"/>
          <path d="M250 300 q26 -10 52 0 t52 0 t52 0"/>
          <path d="M40 320 q26 -10 52 0"/>
        </g>
      </svg>
      <img class="shark" src="../assets/art/shark-hero.webp" alt="">
    </div>
    <div class="text">
      <h1>상어 <span>SOS</span></h1>
      <p class="subtitle">바다로 보내줘!</p>
      <div class="eyebrow">수로에 갇힌 상어를 밀어서 바다로!</div>
      <div class="pill">48개 수로 + 매일 구조작전</div>
    </div>
  </div>
</body>
</html>
