<title>길 잃은 상어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen harbour app that behaves like a native game. Board takes every spare pixel, compact HUD above,
   thumb-sized control bar below. Screens push/pop sideways, results arrive as a bottom sheet. Single committed "북항 수로" look. */
:root {
  --harbor: #0c3340;       /* page ground: deep harbour water */
  --harbor-2: #124452;     /* raised panels */
  --harbor-3: #1b5766;     /* hover / pressed */
  --water: #1e7482;        /* canal water */
  --water-hi: #6fd0cc;     /* ripples, jets */
  --sea: #0f4f6e;          /* open sea at the exit */
  --concrete: #d9d1c1;     /* promenade */
  --concrete-2: #c4b9a3;   /* paver seams */
  --rail: #eef0ea;
  --park: #6b9a5b;
  --ink: #0a232b;
  --text: #ecf5f2;
  --muted: #9dbfbe;
  --buoy: #ff6b3d;         /* accent: lifebuoy orange */
  --buoy-deep: #c8441b;
  --star: #ffc94a;
  --net: #ecd9a0;
  --shark: #8b8a78;        /* copper shark back */
  --shark-2: #6f6e5f;
  /* "Bukang *" = bundled subset fonts (www/ build only, renamed per OFL); the Google Fonts names serve the other builds */
  --font-display: "Bukang Display", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Bukang Body", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(.2, .85, .25, 1);
  --ease-sheet: cubic-bezier(.16, 1, .3, 1);
  --ease-spring: cubic-bezier(.3, 1.5, .5, 1);
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--harbor);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  letter-spacing: -.01em;
  /* Korean typesetting: break between words (not inside them), never fake a bold on single-weight faces */
  word-break: keep-all; overflow-wrap: break-word;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
  /* app feel: no text selection, no long-press callouts, no tap flash, no double-tap zoom */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  /* safe-area insets matter when installed (PWA standalone, native app with notch / gesture bar) */
  padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
  padding-block: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.screen.enter-fwd { animation: push-in .34s var(--ease-out) both; }
.screen.enter-back { animation: pop-in .34s var(--ease-out) both; }
@keyframes push-in { from { transform: translateX(30%); opacity: 0; } }
@keyframes pop-in { from { transform: translateX(-16%); opacity: 0; } }

/* ----- Title ----- */
.title-screen { overflow-y: auto; gap: 14px; scrollbar-width: none; margin-inline: -12px; padding-inline: 12px; -webkit-overflow-scrolling: touch; }
.title-screen::-webkit-scrollbar { display: none; }
.hero { position: relative; border-radius: 24px; overflow: hidden; background: var(--water); flex-shrink: 0; }
.hero canvas { display: block; width: 100%; height: clamp(210px, 33vh, 320px); }
.hero-text { position: absolute; left: 20px; bottom: 16px; right: 20px; pointer-events: none; }
.eyebrow { font-size: 13px; letter-spacing: .03em; color: var(--muted); font-weight: 500; }
.hero .eyebrow { color: var(--ink); opacity: .7; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(50px, 15vw, 76px);
  line-height: 1;
  margin: 2px 0 0;
  color: var(--ink);
  text-wrap: balance;
  letter-spacing: -.01em;
}
h1 .sea { color: var(--buoy-deep); }
.lede { margin: 0; color: var(--text); font-size: 16px; line-height: 1.6; max-width: 34em; text-wrap: pretty; }
.lede b { color: var(--star); font-weight: 700; }
.section-label { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.section-label h2 { font-size: 13.5px; letter-spacing: .02em; color: var(--muted); margin: 0; font-weight: 500; }
.section-label span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapters { display: flex; flex-direction: column; gap: 10px; }
.chapter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapter-head:first-child { margin-top: 0; }
.chapter-head b { font-family: var(--font-display); font-weight: 400; font-size: 23px; letter-spacing: 0; color: var(--text); margin-right: 6px; }
.chapter-head.locked { opacity: .5; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lv {
  background: var(--harbor-2); border: 2px solid transparent; border-radius: 18px;
  min-height: 92px; padding: 10px 6px 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 0; transition: background .15s, transform .18s var(--ease-spring);
  animation: tile-in .4s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 14ms);
}
@keyframes tile-in { from { transform: translateY(10px) scale(.96); opacity: 0; } }
.lv:active { transform: scale(.93); transition-duration: .08s; }
.lv:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .ctrl:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.lv .n { font-family: var(--font-display); font-size: 32px; line-height: 1.05; letter-spacing: 0; }
.lv .nm { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lv .st { font-size: 13px; letter-spacing: 1px; color: var(--star); line-height: 1; }
.lv .st i { font-style: normal; color: var(--harbor-3); }
.lv.cur { border-color: var(--buoy); background: var(--harbor-3); }
.lv[disabled] { opacity: .38; cursor: default; }
.lv[disabled]:active { transform: none; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; font-size: 14px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.legend canvas { width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px; }
.note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--harbor-3); padding-top: 12px; margin: 0; }
.cta-bar { position: sticky; bottom: 0; margin-top: auto; padding-top: 22px; padding-bottom: 8px; background: linear-gradient(transparent, var(--harbor) 45%); z-index: 2; }

/* ----- Buttons ----- */
.btn {
  border: 0; border-radius: 16px; min-height: 52px; padding: 12px 18px; cursor: pointer; font-weight: 700; font-size: 16px;
  background: var(--harbor-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, transform .2s var(--ease-spring), filter .15s;
}
.btn:active { transform: scale(.95); transition-duration: .08s; }
.btn.primary { background: var(--buoy); color: var(--ink); box-shadow: 0 6px 0 var(--buoy-deep); }
.btn.primary:active { transform: translateY(4px) scale(.98); box-shadow: 0 2px 0 var(--buoy-deep); }
.btn.big { width: 100%; min-height: 58px; font-size: 17.5px; border-radius: 18px; }
.btn[disabled] { opacity: .4; cursor: default; }
.icon-btn {
  border: 0; background: var(--harbor-2); border-radius: 14px; width: 46px; height: 46px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; transition: background .15s, transform .2s var(--ease-spring);
}
.icon-btn:active { transform: scale(.9); transition-duration: .08s; }
#soundBtn .off { display: none; }
#soundBtn.muted .on { display: none; }
#soundBtn.muted .off { display: inline; }
#soundBtn.muted { color: var(--muted); }
@media (hover: hover) {
  .lv:not([disabled]):hover, .btn:not(.primary):hover, .icon-btn:hover, .ctrl:hover { background: var(--harbor-3); }
  .btn.primary:hover { filter: brightness(1.06); }
}

/* ----- Game ----- */
.game-screen { gap: 6px; touch-action: none; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.topbar .lvl-title { flex: 1; min-width: 0; text-align: center; }
.lvl-title .num { font-size: 12px; color: var(--muted); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.lvl-title .name { font-family: var(--font-display); font-size: 25px; line-height: 1.15; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.chip {
  background: var(--harbor-2); border-radius: 999px; padding: 4px 12px; font-size: 13.5px;
  display: inline-flex; gap: 6px; align-items: baseline; font-variant-numeric: tabular-nums;
}
.chip b { font-weight: 700; display: inline-block; }
.chip b.bump { animation: count-bump .35s var(--ease-spring); }
@keyframes count-bump { 40% { transform: scale(1.35); } }
.chip .k { color: var(--muted); }
.chip.over b { color: var(--buoy); }
.chip.done b { color: var(--star); }
.chip.net { background: var(--harbor-3); }
.tip { font-size: 13.5px; color: var(--muted); text-align: center; min-height: 2.6em; line-height: 1.3; margin: 0; text-wrap: balance; display: flex; align-items: center; justify-content: center; }
.tip.hint { color: var(--star); }
.tip.flash { animation: tip-in .3s var(--ease-out); }
@keyframes tip-in { from { transform: translateY(4px); opacity: 0; } }
.board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
/* frame = visible part of the canvas; when width is the limit the outer promenade columns are cropped (see resize()) */
.board .frame { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 14px 34px rgba(0,0,0,.32); will-change: transform; flex-shrink: 0; }
.board canvas { display: block; }
.board .frame.enter { animation: board-in .42s var(--ease-out) both; }
@keyframes board-in { from { transform: scale(.94); opacity: 0; } }
.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ctrl {
  border: 0; border-radius: 16px; background: var(--harbor-2); cursor: pointer; min-height: 52px; padding: 8px 6px;
  display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14.5px; font-weight: 700;
  transition: background .15s, transform .2s var(--ease-spring), opacity .15s;
}
.ctrl svg.i { width: 24px; height: 24px; }
.ctrl:active { transform: scale(.92); transition-duration: .08s; }
.ctrl[disabled] { opacity: .35; cursor: default; }
.ctrl[disabled]:active { transform: none; }
.kbd { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
@media (hover: none), (pointer: coarse), (max-height: 760px) { .kbd { display: none; } }

/* ----- Clear sheet ----- */
.overlay {
  position: fixed; inset: 0; background: rgba(4, 18, 24, .62); display: flex; align-items: flex-end; justify-content: center;
  z-index: 10; animation: fade .3s ease-out;
}
.card {
  background: var(--concrete); color: var(--ink); width: 100%; max-width: 520px;
  border-radius: 28px 28px 0 0; padding: 10px 22px calc(20px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 14px; text-align: center; animation: sheet-up .5s var(--ease-sheet) both;
  box-shadow: 0 -10px 40px rgba(0,0,0,.3);
}
.card::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: #b9ad95; margin: 0 auto 4px; }
@keyframes sheet-up { from { transform: translateY(100%); } }
@media (min-width: 640px) and (min-height: 640px) {
  .overlay { align-items: center; }
  .card { border-radius: 28px; padding-bottom: 22px; animation-name: pop; }
  .card::before { display: none; }
}
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 38px; letter-spacing: 0; margin: 4px 0 0; line-height: 1.1; }
.card .sub { margin: 0; font-size: 14px; color: #3d4d4f; }
.stars { display: flex; justify-content: center; gap: 12px; }
.star { width: 62px; height: 62px; }
.star:nth-child(2) { transform: translateY(-8px); }
.star path { fill: #b9ad95; }
.star.on path { fill: var(--star); stroke: #c7881a; stroke-width: 1.5; }
.star.on { animation: star-pop .55s var(--ease-spring) both; }
.star.on:nth-child(2) { animation-name: star-pop-mid; }
@keyframes star-pop { from { transform: scale(0) rotate(-30deg); opacity: 0; } }
@keyframes star-pop-mid { from { transform: translateY(-8px) scale(0) rotate(-30deg); opacity: 0; } }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; text-align: left; }
.checks li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed #b9ad95; padding: 6px 2px; font-variant-numeric: tabular-nums; }
.checks li:last-child { border-bottom: 0; }
.checks .ok { color: #1f6e4a; font-weight: 700; }
.checks .no { color: #8a5a3a; }
.card .row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
.card .btn { background: #c8bea9; min-height: 56px; }
.card .btn.primary { background: var(--buoy); }

@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { transform: scale(.6); opacity: 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
@media (max-height: 640px) {
  .tip { min-height: 0; }
  .ctrl { min-height: 48px; }
}
</style>

<div class="app" id="app">
  <section class="screen title-screen" id="titleScreen">
    <div class="hero">
      <canvas id="heroCanvas" aria-hidden="true"></canvas>
      <div class="hero-text">
        <div class="eyebrow">부산 북항 친수공원 · 수로 탈출 퍼즐</div>
        <h1>길 잃은 <span class="sea">상어</span></h1>
      </div>
    </div>
    <p class="lede">굽은 수로에 들어와 길을 잃은 상어. 화면을 밀어 헤엄치게 하고, 숭어를 먹으며 <b>바다</b>로 보내 주세요.</p>
    <div class="section-label"><h2 id="levelCount">수로</h2><span id="starTotal">★ 0</span></div>
    <div class="chapters" id="levelGrid"></div>
    <div class="section-label"><h2>수로에 있는 것들</h2></div>
    <div class="legend" id="legend"></div>
    <p class="note">2026년 9월 부산 북항 친수공원 수로에 들어온 무태상어(약 3.5m)에서 착안한 퍼즐 게임입니다. 실제 기관·캐릭터와 관련이 없습니다.</p>
    <div class="cta-bar"><button class="btn primary big" id="playBtn" type="button">시작하기</button></div>
  </section>

  <section class="screen game-screen" id="gameScreen" hidden>
    <div class="topbar">
      <button class="icon-btn" id="backBtn" type="button" aria-label="수로 목록으로">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="lvl-title"><div class="num" id="lvNum">1장 · 수로 1</div><div class="name" id="lvName">첫 굽이</div></div>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="소리">
        <svg class="i on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a8 8 0 010 11"/></svg>
        <svg class="i off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
    <div class="stats" id="stats"></div>
    <p class="tip" id="tip"></p>
    <div class="board" id="board"><div class="frame" id="boardFrame"><canvas id="boardCanvas" aria-label="수로 퍼즐 판" role="img"></canvas></div></div>
    <div class="controls">
      <button class="ctrl" id="undoBtn" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 10l5 5"/><path d="M4 10h10a5 5 0 010 10h-3"/></svg>되돌리기
      </button>
      <button class="ctrl" id="restartBtn" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.3-5.7"/><path d="M20.5 4v4.5H16"/></svg>처음부터
      </button>
      <button class="ctrl" id="hintBtn" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0012 3z"/></svg>힌트
      </button>
    </div>
    <p class="kbd">방향키·WASD로 이동 · Z 되돌리기 · R 처음부터 · H 힌트</p>
  </section>
</div>

<div class="overlay" id="clearOverlay" hidden>
  <div class="card" role="dialog" aria-labelledby="clearTitle">
    <h3 id="clearTitle">바다로 나갔어요!</h3>
    <div class="stars" id="clearStars"></div>
    <ul class="checks" id="clearChecks"></ul>
    <div class="row">
      <button class="btn" id="againBtn" type="button">다시 하기</button>
      <button class="btn primary" id="nextBtn" type="button">다음 수로</button>
    </div>
  </div>
</div>
