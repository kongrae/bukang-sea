<title>부캉이 바다로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen harbour app. Board fills the middle, HUD above, controls below. Single committed "북항 수로" look. */
:root {
  --harbor: #0c3340;       /* page ground: deep harbour water */
  --harbor-2: #124452;     /* raised panels */
  --harbor-3: #1b5766;     /* hover / pressed */
  --water: #1e7482;        /* canal water */
  --water-hi: #6fd0cc;     /* ripples, jets */
  --sea: #0f4f6e;          /* open sea at the exit */
  --concrete: #d9d1c1;     /* promenade */
  --concrete-2: #c4b9a3;   /* paver seams */
  --rail: #eef0ea;
  --park: #6b9a5b;
  --ink: #0a232b;
  --text: #ecf5f2;
  --muted: #9dbfbe;
  --buoy: #ff6b3d;         /* accent: lifebuoy orange */
  --buoy-deep: #c8441b;
  --star: #ffc94a;
  --net: #ecd9a0;
  --shark: #8b8a78;        /* copper shark back */
  --shark-2: #6f6e5f;
  --font-display: "Bagel Fat One", "Jua", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--harbor);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  /* safe-area insets matter when installed (PWA standalone, native app with notch / gesture bar) */
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* ----- Title ----- */
.title-screen { overflow-y: auto; padding-bottom: 8px; }
.hero { position: relative; border-radius: 18px; overflow: hidden; background: var(--water); flex-shrink: 0; }
.hero canvas { display: block; width: 100%; height: 210px; }
.hero-text { position: absolute; left: 18px; bottom: 14px; right: 18px; pointer-events: none; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.hero .eyebrow { color: var(--ink); opacity: .7; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(40px, 12vw, 56px);
  line-height: 1;
  margin: 2px 0 0;
  color: var(--ink);
  text-wrap: balance;
  letter-spacing: -.01em;
}
h1 .sea { color: var(--buoy-deep); }
.lede { margin: 0; color: var(--text); max-width: 34em; }
.lede b { color: var(--star); font-weight: 700; }
.section-label { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.section-label h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 500; }
.section-label span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapters { display: flex; flex-direction: column; gap: 8px; }
.chapter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chapter-head:first-child { margin-top: 0; }
.chapter-head b { font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--text); margin-right: 4px; }
.chapter-head.locked { opacity: .5; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lv {
  background: var(--harbor-2); border: 1px solid transparent; border-radius: 12px;
  padding: 8px 6px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 0; transition: background .15s, transform .1s;
}
.lv:hover { background: var(--harbor-3); }
.lv:active { transform: scale(.97); }
.lv:focus-visible, .btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.lv .n { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.lv .nm { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lv .st { font-size: 12px; letter-spacing: 1px; color: var(--star); line-height: 1; }
.lv .st i { font-style: normal; color: var(--harbor-3); }
.lv.cur { border-color: var(--buoy); }
.lv[disabled] { opacity: .38; cursor: default; }
.lv[disabled]:hover { background: var(--harbor-2); }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend canvas { width: 26px; height: 26px; flex-shrink: 0; border-radius: 6px; }
.note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--harbor-3); padding-top: 10px; margin: 0; }

/* ----- Buttons ----- */
.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; font-weight: 700;
  background: var(--harbor-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, transform .1s;
}
.btn:hover { background: var(--harbor-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--buoy); color: var(--ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .4; cursor: default; }
.icon-btn { border: 0; background: var(--harbor-2); border-radius: 10px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; font-size: 13px; font-weight: 500; }
.icon-btn:hover { background: var(--harbor-3); }

/* ----- Game ----- */
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .lvl-title { flex: 1; min-width: 0; text-align: center; }
.lvl-title .num { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.lvl-title .name { font-family: var(--font-display); font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.chip {
  background: var(--harbor-2); border-radius: 999px; padding: 4px 11px; font-size: 13px;
  display: inline-flex; gap: 6px; align-items: baseline; font-variant-numeric: tabular-nums;
}
.chip b { font-weight: 700; }
.chip .k { color: var(--muted); }
.chip.over b { color: var(--buoy); }
.chip.done b { color: var(--star); }
.chip.net { background: var(--harbor-3); }
.tip { font-size: 13px; color: var(--muted); text-align: center; min-height: 2.9em; margin: 0; text-wrap: balance; }
.tip.hint { color: var(--star); }
.board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
.board canvas { display: block; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.28); }
.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.controls .btn { padding: 11px 8px; font-size: 14px; }
.kbd { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

/* ----- Clear overlay ----- */
.overlay {
  position: fixed; inset: 0; background: rgba(6, 26, 33, .72); display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 10; animation: fade .25s ease-out;
}
.card {
  background: var(--concrete); color: var(--ink); border-radius: 20px; padding: 22px 20px 18px; width: 100%; max-width: 360px;
  display: flex; flex-direction: column; gap: 14px; text-align: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1);
}
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 32px; margin: 0; line-height: 1.1; }
.card .sub { margin: 0; font-size: 14px; color: #3d4d4f; }
.stars { display: flex; justify-content: center; gap: 10px; }
.star { width: 54px; height: 54px; }
.star path { fill: #b9ad95; }
.star.on path { fill: var(--star); stroke: #c7881a; stroke-width: 1.5; }
.star.on { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.star.on:nth-child(2) { animation-delay: .12s; }
.star.on:nth-child(3) { animation-delay: .24s; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; text-align: left; }
.checks li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed #b9ad95; padding: 4px 2px; font-variant-numeric: tabular-nums; }
.checks li:last-child { border-bottom: 0; }
.checks .ok { color: #1f6e4a; font-weight: 700; }
.checks .no { color: #8a5a3a; }
.card .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.card .btn { background: #c8bea9; }
.card .btn.primary { background: var(--buoy); }

@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { transform: scale(.6); opacity: 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
@media (max-height: 640px) {
  .tip { min-height: 0; }
  .kbd { display: none; }
}
</style>

<div class="app" id="app">
  <section class="screen title-screen" id="titleScreen">
    <div class="hero">
      <canvas id="heroCanvas" aria-hidden="true"></canvas>
      <div class="hero-text">
        <div class="eyebrow">부산 북항 친수공원 · 수로 탈출 퍼즐</div>
        <h1>부캉이 <span class="sea">바다로</span></h1>
      </div>
    </div>
    <p class="lede">굽은 수로에 들어와 길을 잃은 상어 부캉이. 화면을 밀어 헤엄치게 하고, 숭어를 먹으며 <b>바다</b>로 보내 주세요.</p>
    <button class="btn primary" id="playBtn" type="button">이어서 하기</button>
    <div class="section-label"><h2 id="levelCount">수로</h2><span id="starTotal">★ 0</span></div>
    <div class="chapters" id="levelGrid"></div>
    <div class="section-label"><h2>수로에 있는 것들</h2></div>
    <div class="legend" id="legend"></div>
    <p class="note">2026년 9월 부산 북항 친수공원 수로에 들어온 무태상어(약 3.5m)에서 착안한 팬 게임 프로토타입입니다. 실제 기관·캐릭터와 관련이 없습니다.</p>
  </section>

  <section class="screen" id="gameScreen" hidden>
    <div class="topbar">
      <button class="icon-btn" id="backBtn" type="button" aria-label="수로 목록으로">← 목록</button>
      <div class="lvl-title"><div class="num" id="lvNum">수로 1</div><div class="name" id="lvName">첫 굽이</div></div>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">소리 켬</button>
    </div>
    <div class="stats" id="stats"></div>
    <p class="tip" id="tip"></p>
    <div class="board" id="board"><canvas id="boardCanvas" aria-label="수로 퍼즐 판" role="img"></canvas></div>
    <div class="controls">
      <button class="btn" id="undoBtn" type="button">되돌리기</button>
      <button class="btn" id="restartBtn" type="button">처음부터</button>
      <button class="btn" id="hintBtn" type="button">힌트</button>
    </div>
    <p class="kbd">방향키·WASD로 이동 · Z 되돌리기 · R 처음부터</p>
  </section>
</div>

<div class="overlay" id="clearOverlay" hidden>
  <div class="card" role="dialog" aria-labelledby="clearTitle">
    <h3 id="clearTitle">바다로 나갔어요!</h3>
    <div class="stars" id="clearStars"></div>
    <ul class="checks" id="clearChecks"></ul>
    <div class="row">
      <button class="btn" id="againBtn" type="button">다시 하기</button>
      <button class="btn primary" id="nextBtn" type="button">다음 수로</button>
    </div>
  </div>
</div>
