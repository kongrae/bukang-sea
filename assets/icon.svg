<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon source. Full-bleed so it also works as a maskable icon (keep art inside the centre 80% circle).
       Front-facing smiling shark (icon only; in-game sharks stay top-down, see drawShark() in src/game.js).
       tools/icons.js splits this file: the first <rect> and <g id="bg"> are the background (gradient sea + 3D bezel),
       the <g fill="none" stroke="#fff"> group is the ripple layer, everything else is the foreground art;
       <defs> is shared by both layers. <g id="bg"> must not contain nested <g>. -->
  <rect width="512" height="512" fill="#1e7482"/>
  <g fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="6" stroke-linecap="round">
    <path d="M66 118 q30 -14 60 0 t60 0"/>
    <path d="M326 420 q30 -14 60 0 t60 0"/>
  </g>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe0ec"/>
      <stop offset=".45" stop-color="#139fb8"/>
      <stop offset="1" stop-color="#082a52"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".15" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx=".5" cy="1.05" r=".75">
      <stop offset="0" stop-color="#041a33" stop-opacity=".45"/>
      <stop offset="1" stop-color="#041a33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7ff0ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7ff0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset=".35" stop-color="#8fd9e6"/>
      <stop offset=".65" stop-color="#1f7f9a"/>
      <stop offset="1" stop-color="#062340"/>
    </linearGradient>
    <linearGradient id="bezelIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062340"/>
      <stop offset=".5" stop-color="#1f7f9a"/>
      <stop offset="1" stop-color="#cfeff6"/>
    </linearGradient>
    <radialGradient id="head" cx=".42" cy=".3" r=".75">
      <stop offset="0" stop-color="#a9d4ee"/>
      <stop offset=".55" stop-color="#6d9cc6"/>
      <stop offset="1" stop-color="#3b5f88"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbfe" stop-opacity="0"/>
      <stop offset=".35" stop-color="#f7fbfe" stop-opacity=".92"/>
      <stop offset="1" stop-color="#dbe9f4"/>
    </linearGradient>
    <linearGradient id="bodyBack" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b74a0"/>
      <stop offset="1" stop-color="#7fb0d6"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c88b4"/>
      <stop offset="1" stop-color="#2f5479"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2638"/>
      <stop offset="1" stop-color="#3a2230"/>
    </linearGradient>
    <linearGradient id="buoy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#ff5a2e"/>
    </linearGradient>
    <radialGradient id="bubble" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="inner"><rect x="34" y="34" width="444" height="444" rx="92"/></clipPath>
  </defs>

  <!-- background layer: gradient sea, light rays, 3D bezel -->
  <g id="bg">
    <rect width="512" height="512" fill="url(#sea)"/>
    <rect x="0" y="0" width="60" height="640" rx="30" fill="#fff" fill-opacity=".10" transform="translate(96 -60) rotate(28)"/>
    <rect x="104" y="0" width="34" height="640" rx="17" fill="#fff" fill-opacity=".07" transform="translate(96 -60) rotate(28)"/>
    <rect x="176" y="0" width="84" height="640" rx="42" fill="#fff" fill-opacity=".06" transform="translate(96 -60) rotate(28)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#deep)"/>
    <rect x="30" y="38" width="452" height="452" rx="100" fill="#031426" fill-opacity=".55" filter="url(#soft)"/>
    <rect x="22" y="22" width="468" height="468" rx="104" fill="none" stroke="url(#bezel)" stroke-width="24"/>
    <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="#031426" stroke-opacity=".45" stroke-width="4"/>
    <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="url(#bezelIn)" stroke-width="4"/>
    <rect x="37" y="37" width="438" height="438" rx="90" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <rect x="40" y="40" width="432" height="432" rx="88" fill="url(#spot)" stroke="none"/>
    <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="#031426" stroke-opacity=".35" stroke-width="10" filter="url(#blur3)"/>
  </g>

  <!-- bubbles and sparkles -->
  <g stroke="#fff" stroke-opacity=".5" stroke-width="2">
    <circle cx="408" cy="150" r="14" fill="url(#bubble)"/>
    <circle cx="436" cy="190" r="8" fill="url(#bubble)"/>
    <circle cx="96" cy="400" r="11" fill="url(#bubble)"/>
    <circle cx="124" cy="432" r="6" fill="url(#bubble)"/>
  </g>
  <g fill="#fff">
    <path d="M178 92 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 Z" fill-opacity=".9"/>
    <path d="M418 404 l3.5 9 l9 3.5 l-9 3.5 l-3.5 9 l-3.5 -9 l-9 -3.5 l9 -3.5 Z" fill-opacity=".7"/>
  </g>

  <!-- life buoy (small, top-left) -->
  <g transform="translate(114 134)">
    <circle cx="4" cy="7" r="36" fill="#041a33" fill-opacity=".3"/>
    <circle r="36" fill="url(#buoy)"/>
    <g fill="#fff8f0">
      <path d="M-36 0 A36 36 0 0 1 -25.5 -25.5 L-13.4 -13.4 A19 19 0 0 0 -19 0 Z"/>
      <path d="M36 0 A36 36 0 0 0 25.5 -25.5 L13.4 -13.4 A19 19 0 0 1 19 0 Z"/>
      <path d="M-36 0 A36 36 0 0 0 -25.5 25.5 L-13.4 13.4 A19 19 0 0 1 -19 0 Z"/>
      <path d="M36 0 A36 36 0 0 1 25.5 25.5 L13.4 13.4 A19 19 0 0 0 19 0 Z"/>
    </g>
    <circle r="19" fill="#0f6d8a"/>
    <circle r="19" fill="url(#sea)" fill-opacity=".9"/>
    <circle r="36" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5"/>
    <circle cx="-15" cy="-17" r="7" fill="#fff" fill-opacity=".55"/>
  </g>

  <!-- shark: body sweeping back to the top-right, head facing the viewer -->
  <g>
    <ellipse cx="262" cy="330" rx="150" ry="110" fill="#031426" fill-opacity=".38" filter="url(#soft)"/>
    <!-- tail fin -->
    <path fill="url(#fin)" d="M372 150 C392 118 418 96 446 82 C430 108 424 128 426 150 C440 158 452 170 458 186 C430 176 404 172 380 176 Z"/>
    <!-- body -->
    <path fill="url(#bodyBack)" d="M212 232 C240 180 300 150 372 150 C388 150 392 170 382 180 C340 196 316 226 304 262 Z"/>
    <path fill="#fff" fill-opacity=".18" d="M236 214 C262 184 306 162 362 158 C330 172 304 196 290 226 Z"/>
    <!-- dorsal fin -->
    <path fill="url(#fin)" d="M286 196 C296 150 318 120 346 102 C342 134 346 160 360 180 C338 182 312 188 286 196 Z"/>
    <!-- pectoral fins -->
    <path fill="url(#fin)" d="M176 300 C140 318 104 350 78 392 C120 378 158 374 196 380 C186 358 180 330 176 300 Z"/>
    <path fill="url(#fin)" d="M344 300 C380 318 416 350 442 392 C400 378 362 374 324 380 C334 358 340 330 344 300 Z"/>
    <path fill="#fff" fill-opacity=".14" d="M176 300 C150 316 122 338 100 364 C130 356 160 354 190 358 Z"/>
    <path fill="#fff" fill-opacity=".14" d="M344 300 C370 316 398 338 420 364 C390 356 360 354 330 358 Z"/>
    <!-- head -->
    <path fill="url(#head)" d="M260 166 C336 166 384 224 384 300 C384 364 338 408 260 408 C182 408 136 364 136 300 C136 224 184 166 260 166 Z"/>
    <path fill="url(#belly)" d="M152 300 C160 360 200 406 260 408 C320 406 360 360 368 300 C340 318 300 326 260 326 C220 326 180 318 152 300 Z"/>
    <ellipse cx="236" cy="208" rx="70" ry="26" fill="#fff" fill-opacity=".22"/>
    <!-- gills -->
    <g fill="none" stroke="#2f5479" stroke-opacity=".75" stroke-width="3.2" stroke-linecap="round">
      <path d="M156 268 q-8 16 0 32"/><path d="M168 262 q-9 20 0 40"/><path d="M181 258 q-10 24 0 48"/>
      <path d="M364 268 q8 16 0 32"/><path d="M352 262 q9 20 0 40"/><path d="M339 258 q10 24 0 48"/>
    </g>
    <!-- nostrils -->
    <ellipse cx="238" cy="282" rx="3.5" ry="5" fill="#2f5479" fill-opacity=".6"/>
    <ellipse cx="282" cy="282" rx="3.5" ry="5" fill="#2f5479" fill-opacity=".6"/>
    <!-- smiling mouth with teeth and tongue -->
    <path fill="url(#mouth)" d="M174 318 C210 342 310 342 346 318 C330 384 190 384 174 318 Z"/>
    <path fill="#e9607a" d="M214 356 C236 376 284 376 306 356 C290 372 230 372 214 356 Z"/>
    <path fill="#fff" d="M186 324 l9 16 l9 -13 l9 15 l9 -13 l9 14 l9 -13 l9 13 l9 -13 l9 13 l9 -14 l9 13 l9 -15 l9 13 l9 -16 C318 336 282 341 260 341 C238 341 204 336 186 324 Z"/>
    <path fill="none" stroke="#1a2638" stroke-width="4" stroke-linecap="round" d="M170 314 C206 342 314 342 350 314"/>
    <path fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round" d="M178 308 C210 330 310 330 342 308"/>
    <!-- eyes -->
    <ellipse cx="206" cy="252" rx="19" ry="21" fill="#fff"/>
    <ellipse cx="314" cy="252" rx="19" ry="21" fill="#fff"/>
    <circle cx="209" cy="255" r="12" fill="#163a5c"/>
    <circle cx="311" cy="255" r="12" fill="#163a5c"/>
    <circle cx="209" cy="255" r="7" fill="#06111c"/>
    <circle cx="311" cy="255" r="7" fill="#06111c"/>
    <circle cx="204" cy="249" r="4" fill="#fff"/>
    <circle cx="306" cy="249" r="4" fill="#fff"/>
    <circle cx="213" cy="260" r="1.8" fill="#fff" fill-opacity=".8"/>
    <circle cx="315" cy="260" r="1.8" fill="#fff" fill-opacity=".8"/>
    <!-- happy upper lids -->
    <path fill="url(#head)" d="M186 240 C196 226 216 226 226 240 L226 232 C216 222 196 222 186 232 Z"/>
    <path fill="url(#head)" d="M294 240 C304 226 324 226 334 240 L334 232 C324 222 304 222 294 232 Z"/>
    <!-- cheek blush -->
    <ellipse cx="184" cy="296" rx="13" ry="7" fill="#ff8a9a" fill-opacity=".35"/>
    <ellipse cx="336" cy="296" rx="13" ry="7" fill="#ff8a9a" fill-opacity=".35"/>
    <!-- motion arcs -->
    <g fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round">
      <path d="M102 232 q-18 24 -8 56"/>
      <path d="M418 232 q18 24 8 56"/>
      <path d="M120 206 q-10 12 -8 26" stroke-opacity=".35"/>
      <path d="M400 206 q10 12 8 26" stroke-opacity=".35"/>
    </g>
  </g>
</svg>
